name: "Android Build"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > argonfit.keystore

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../argonfit.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Signed APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../argonfit.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create ZIP with artifacts
        run: |
          zip artifacts.zip android/app/build/outputs/bundle/release/*.aab android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARGONFIT-PRO-AAB-SIGNED
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARGONFIT-PRO-APK-SIGNED
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARGONFIT-PRO-ARTIFACTS-ZIP
          path: artifacts.zip

      - name: Print download instructions
        run: |
          echo "Para descargar:"
          echo "gh run list --workflow='Android Build'"
          echo "gh run download <RUN_ID> -n ARGONFIT-PRO-AAB-SIGNED"
          echo "gh run download <RUN_ID> -n ARGONFIT-PRO-APK-SIGNED"
          echo "gh run download <RUN_ID> -n ARGONFIT-PRO-ARTIFACTS-ZIP"


